backend:
  name: git-gateway
  branch: main # ou master si ton dépôt utilise master

# Dossier où seront stockés les images uploadées par Adanzo
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles" # Nom interne
    label: "Articles" # Nom affiché dans le menu
    folder: "articles" # Dossier où seront créés les fichiers .md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - { label: "Extrait", name: "excerpt", widget: "text", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }